name: xnet-teardown

# corresponds to
# 7:55AM EST / 4:55AM PST
# 3:55PM EST / 12:55PM PST
# 11:55PM EST / 8:55PM PST
on:
  schedule:
    - cron: "55 11 * * *"
    - cron: "55 19 * * *"
    - cron: "55 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
  SERVER_NAME: xnet-public
  FLOATING_IP_NAME: xmtp-migration-test

jobs:
  teardown:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-25.11

      - uses: nicknovitski/nix-develop@v1

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/xnet
          chmod 600 ~/.ssh/xnet

      - name: Teardown
        run: |
          chmod +x ./dev/teardown
          SSH_KEY_PATH=~/.ssh/xnet LOG_DIR=./logs ./dev/teardown

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnet-logs-${{ github.run_id }}
          path: logs/
          retention-days: 7
