name: xnet-teardown

# corresponds to
# 6:55AM EST / 3:55AM PST
# 2:55PM EST / 11:55AM PST
# 10:55PM EST / 7:55PM PST
on:
  schedule:
    - cron: "55 10 * * *"
    - cron: "55 18 * * *"
    - cron: "55 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  SERVER_NAME: xnet-public
  FLOATING_IP_NAME: xmtp-migration-test

jobs:
  teardown:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-25.11

      - uses: nicknovitski/nix-develop@v1

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/xnet
          chmod 600 ~/.ssh/xnet

      - name: Teardown
        run: |
          chmod +x ./dev/teardown
          SSH_KEY_PATH=~/.ssh/xnet LOG_DIR=./logs ./dev/teardown

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnet-logs-${{ github.run_id }}
          path: logs/
          retention-days: 7

      - name: Notify Slack on failure
        if: failure()
        run: |
          MSG=":x: xnet-teardown workflow failed
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST -H 'Content-type: application/json' \
            --data "$(jq -n --arg text "$MSG" '{text: $text}')" \
            "$SLACK_WEBHOOK_URL" || true
