name: xnet-restart

# Manual-only: tear down the current xnet deploy, then provision a fresh one.
# Useful when you want to cycle the network without waiting for the scheduled
# start/teardown crons.

on:
  workflow_dispatch:
    inputs:
      cutover_delay_minutes:
        description: "Minutes from provision to cutover (default 240 = 4h)"
        required: false
        type: string
        default: "240"
      skip_teardown_logs:
        description: "Skip log collection during teardown"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  SERVER_NAME: xnet-public
  FLOATING_IP_NAME: xmtp-migration-test-west
  SSH_KEY_NAME: insipx-hetzner

jobs:
  restart:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-25.11

      - uses: cachix/cachix-action@v17
        with:
          name: xmtp
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - uses: nicknovitski/nix-develop@v1

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/xnet
          chmod 600 ~/.ssh/xnet

      - name: Teardown
        env:
          NO_LOGS: ${{ inputs.skip_teardown_logs && 'true' || '' }}
        run: |
          chmod +x ./dev/teardown
          SSH_KEY_PATH=~/.ssh/xnet LOG_DIR=./logs ./dev/teardown

      - name: Upload teardown logs
        if: ${{ !inputs.skip_teardown_logs }}
        uses: actions/upload-artifact@v4
        with:
          name: xnet-logs-${{ github.run_id }}
          path: logs/
          retention-days: 7

      - name: Provision
        env:
          CUTOVER_DELAY_MINUTES: ${{ inputs.cutover_delay_minutes }}
        run: |
          chmod +x ./dev/provision
          SSH_KEY_PATH=~/.ssh/xnet ./dev/provision

      - name: Notify Slack on failure
        if: failure()
        run: |
          MSG=":x: xnet-restart workflow failed
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST -H 'Content-type: application/json' \
            --data "$(jq -n --arg text "$MSG" '{text: $text}')" \
            "$SLACK_WEBHOOK_URL" || true
