name: xnet-start

# corresponds to
# 11:00PM EST / 8PM PST
# 7AM EST / 4AM PST
# 3PM EST / 12PM PST
on:
  schedule:
    - cron: "0 3 * * *"
    - cron: "0 11 * * *"
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
  SERVER_NAME: xnet-public
  FLOATING_IP_NAME: xmtp-migration-test-west
  SSH_KEY_NAME: insipx-hetzner

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-25.11

      - uses: cachix/cachix-action@v17
        with:
          name: xmtp
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - uses: nicknovitski/nix-develop@v1

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/xnet
          chmod 600 ~/.ssh/xnet

      - name: Deploy
        run: |
          chmod +x ./dev/provision
          SSH_KEY_PATH=~/.ssh/xnet ./dev/provision
